# The documentation site: Zensical reads docs/ and writes site/, and .github/workflows/docs.yml
# publishes it to https://stuffam.github.io/drawbridge/. `make docs-serve` previews it.

[project]
site_name = "Drawbridge"
site_url = "https://stuffam.github.io/drawbridge/"
site_description = "A self-hosted web manager for a WireGuard VPN server."

repo_name = "stuffam/drawbridge"
repo_url = "https://github.com/stuffam/drawbridge"
edit_uri = "edit/main/docs/user_docs/"
docs_dir = "docs/user_docs/"

copyright = """
<p>
&copy 2026 stuffam<br/>
<span>This project is licensed under Apache License 2.0.</span><br/>
<span>"WireGuard" and the "WireGuard" logo are registered trademarks of Jason A. Donenfeld. Drawbridge isn't affiliated with or endorsed by the WireGuard project.</span>
</p>
"""

nav = [
  "index.md",
  "getting-started.md",
  { "Guides" = [
    { "Client" = [
      "guides/client-configuration.md",
      "guides/client-rotate-key.md",
    ] },
    { "Server" = [
      "guides/server-configuration.md",
      "guides/addressing.md",
      "guides/server-rotate-key.md",
      "guides/dns-settings.md",
      "guides/adguard-home.md",
      "guides/pi-hole.md",
    ] },
    { "System" = [
      "guides/diagnostics.md",
      "guides/backup-restore.md",
      "guides/tls-certificate.md",
      "guides/upgrade.md",
      "guides/remove.md"
    ] },
    { "Other Settings & Tools" = [
      "guides/api-tokens.md",
      "guides/two-factor.md",
      "guides/cli-tools.md",
    ] },
  ] }
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra.version]
provider = "mike"
# Show an alias beside its version in the selector, so a reader can see which one is "latest".
alias = true

# The docs are written as GitHub-flavored Markdown, so this is a short list. Zensical's starter
# list also turns on arithmatex (`$...$` becomes math, and shell commands have dollar signs),
# tilde and caret (`~x~` and `^x^` become subscripts and superscripts), and smartsymbols (`1/2`
# becomes a fraction). Add one only after checking that no page changes.
[project.markdown_extensions]
admonition = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
